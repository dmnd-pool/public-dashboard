name: Hashrate alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      test_message:
        description: "Send a test Telegram message instead of checking hashrate"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: hashrate-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: alerts/state.json
          key: hashrate-alert-state-${{ github.run_id }}
          restore-keys: hashrate-alert-state-
      - name: Check hashrate
        run: node alerts/hashrate-alert.mjs ${{ inputs.test_message && '--test-message' || '' }}
        env:
          API_URL: ${{ vars.VITE_API_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: alerts/state.json
          key: hashrate-alert-state-${{ github.run_id }}
